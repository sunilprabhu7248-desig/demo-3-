<!doctype html>

<head>

        body {

        nav {

            justify-content: flex-start;
            color: white;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }

        a {
            text-decoration: none;
            height: 20px;
            margin: 3px;
            color: white;
            font-weight: bold;
        }

        a:hover {
            background-color: white;
            color: black;
            cursor: pointer;
        }

        a.active {

        section {

        }

            width:50%;
            margin:auto;
        }

            align-content: center;
            height: 100px;
            margin-left: 30px;
            margin-top: 9px;
        }

        video {
            display: flex;
            margin-left: 400px;
            margin-bottom: 20px;
        }

        .box {
            display: flex;

        }

        .box1 {
            display: flex;
            margin-left: 70px;

        }

        .box2 {
            display: flex;
            justify-content: flex-end;
            margin-left: 800px;
        }

        .box3 {
            display: flex;
            width: 17%;
            margin:0px 20px;
            border:2px solid grey;
        }

        .icon {
            height: 45px;
            margin: 5px;
            display: flex;
        }

        footer {
            background-color: darkblue;
            display: flex;
            width: 100%;
            position: fixed;
            left: 0;
            bottom: 0;
            justify-content: space-between;
            color: white;
        }
    </style>
</head>

<body>
    <section>

        </div>
        <nav>
